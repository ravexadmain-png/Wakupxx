<body class="bg-black text-zinc-100 font-sans antialiased max-w-md mx-auto min-h-screen flex flex-col relative selection:bg-red-500 selection:text-white">

    <!-- Top Navigation Header -->

        <div onclick="goHome()" class="flex items-center space-x-2 cursor-pointer">
            <div class="w-8 h-8 rounded-lg bg-red-600 flex items-center justify-center font-black text-white italic tracking-tighter text-lg">W</div>
            <span class="text-lg font-black tracking-wider text-white">WAKUP</span>
        </div>
        
        <!-- Smartlink Quick CTA Button -->
        <a href="https://www.profitableratecpmnetwork.com/ar5ag62qw?key=bee521f29795c916d7a8e366e567954f" target="_blank" class="bg-red-600/20 border border-red-600/50 text-red-500 hover:bg-red-600 hover:text-white text-xs font-bold px-3 py-1.5 rounded-full transition flex items-center space-x-1">
            <i class="fa-solid fa-bolt"></i>
            <span>VIP DEALS</span>
        </a>
    </header>

    <!-- Banner 468x60 Ad Slot -->
    <div class="w-full bg-zinc-950 flex justify-center py-2 border-b border-zinc-900 overflow-hidden">
        <script>
          atOptions = {

            'height' : 60,
            'width' : 468,
            'params' : {}
          };

        <script src="https://www.highrevenueformat.com/63989060598cbab5d00a0f5a5fbea34f/invoke.js"></script>
    </div>

    <!-- Main Content Area -->
    <main class="flex-1 pb-20 overflow-y-auto" id="main-container">

        <!-- HOME VIEW -->
        <div id="home-view" class="space-y-4 pt-2">
            
            <!-- Native Banner Ad Top Slot -->
            <div class="mx-3 p-3 bg-zinc-900 border border-zinc-800 rounded-xl">
                <p class="text-[10px] text-zinc-500 mb-2 uppercase tracking-widest font-bold">Sponsored Partner</p>
                <script async="async" data-cfasync="false" src="https://pl31836184.profitableratecpmnetwork.com/7f9dd53d207899d1bd89d9c35354c5b8/invoke.js"></script>
                <div id="container-7f9dd53d207899d1bd89d9c35354c5b8"></div>
            </div>

            <!-- Video Feed Grid (Using image.jpg to image9.jpg) -->
            <div id="video-feed" class="flex flex-col space-y-4 px-3">
                <!-- Injected via JavaScript -->
            </div>

            <!-- Banner 160x300 Ad Slot -->
            <div class="w-full flex justify-center py-4 bg-zinc-950 my-4 border-y border-zinc-900">
                <script>
                  atOptions = {
                    'key' : 'bde809d76cfdb10f27fac33e8909201e',
                    'format' : 'iframe',
                    'height' : 300,
                    'width' : 160,
                    'params' : {}
                  };
                </script>
                <script src="https://www.highrevenueformat.com/bde809d76cfdb10f27fac33e8909201e/invoke.js"></script>
            </div>
        </div>

        <!-- WATCH VIEW (Hidden Initially) -->
        <div id="watch-view" class="hidden flex flex-col">
            <div class="relative w-full aspect-video bg-black">
                <iframe id="watch-iframe" class="w-full h-full" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
            
            <!-- Watch View Actions & Native Ad -->
            <div class="p-4 space-y-4">
                <h1 id="watch-title" class="text-base font-bold text-white"></h1>
                <div class="flex items-center justify-between border-y border-zinc-900 py-3">
                    <div class="flex items-center space-x-2">
                        <div id="watch-avatar" class="w-8 h-8 rounded-full bg-red-600 flex items-center justify-center font-bold text-xs text-white">W</div>
                        <span id="watch-channel" class="text-xs font-semibold text-zinc-300"></span>
                    </div>
                    <button onclick="alert('Subscribed!')" class="bg-white text-black text-xs font-bold px-4 py-1.5 rounded-full">Subscribe</button>
                </div>

                <!-- Native Banner Ad inside Watch view -->
                <div class="p-3 bg-zinc-900 border border-zinc-800 rounded-xl">
                    <p class="text-[10px] text-zinc-500 mb-2 uppercase tracking-widest font-bold">Sponsored Ad</p>
                    <script async="async" data-cfasync="false" src="https://pl31836184.profitableratecpmnetwork.com/7f9dd53d207899d1bd89d9c35354c5b8/invoke.js"></script>
                    <div id="container-7f9dd53d207899d1bd89d9c35354c5b8"></div>
                </div>
            </div>
        </div>

    </main>

    <!-- Mobile Bottom Navigation Bar -->
    <nav class="absolute bottom-0 left-0 right-0 bg-zinc-950 border-t border-zinc-900 h-16 flex items-center justify-around z-50">
        <button onclick="goHome()" class="flex flex-col items-center text-red-500">
            <i class="fa-solid fa-house text-lg"></i>
            <span class="text-[10px] mt-1 font-semibold">Home</span>
        </button>
        <a href="https://www.profitableratecpmnetwork.com/ar5ag62qw?key=bee521f29795c916d7a8e366e567954f" target="_blank" class="flex flex-col items-center text-zinc-400 hover:text-white">
            <i class="fa-solid fa-fire text-lg"></i>
            <span class="text-[10px] mt-1 font-semibold">Trending</span>
        </a>
        <a href="https://www.profitableratecpmnetwork.com/ar5ag62qw?key=bee521f29795c916d7a8e366e567954f" target="_blank" class="flex flex-col items-center text-zinc-400 hover:text-white">
            <i class="fa-solid fa-compass text-lg"></i>
            <span class="text-[10px] mt-1 font-semibold">Explore</span>
        </a>
    </nav>

    <!-- JavaScript Application Engine -->
    <script>
        // Video Database mapped with local thumbnail image files (image.jpg to image9.jpg)
        const wakupVideos = [
            { id: 1, title: "Wakup Exclusive Episode 01", channel: "Wakup TV", thumbnail: "image.jpg", ytId: "dQw4w9WgXcQ" },
            { id: 2, title: "Late Night Beats & Vibes", channel: "SoundWave", thumbnail: "image2.jpg", ytId: "5qap5aO4i9A" },
            { id: 3, title: "Pro Mobile Streaming Tips", channel: "Creator Hub", thumbnail: "image3.jpg", ytId: "PkZNo7MFNFg" },
            { id: 4, title: "Amazing Nature Cinematic View", channel: "WildLife", thumbnail: "image4.jpg", ytId: "8sR98xZ_G40" },
            { id: 5, title: "Top Mobile Gaming Highlights", channel: "Gaming Pro", thumbnail: "image5.jpg", ytId: "mU6anWqZJcc" },
            { id: 6, title: "Futuristic Tech Showcase 2026", channel: "TechInsider", thumbnail: "image6.jpg", ytId: "kJQP7kiw5Fk" },
            { id: 7, title: "Lo-Fi Chill Sessions Vol. 4", channel: "ChillHop", thumbnail: "image7.jpg", ytId: "5qap5aO4i9A" },
            { id: 8, title: "Urban Streetlife Documentary", channel: "MetroStories", thumbnail: "image8.jpg", ytId: "dQw4w9WgXcQ" },
            { id: 9, title: "Speed Coding Live Session", channel: "DevStream", thumbnail: "image9.jpg", ytId: "PkZNo7MFNFg" }
        ];

        const smartlinkURL = "https://www.profitableratecpmnetwork.com/ar5ag62qw?key=bee521f29795c916d7a8e366e567954f";

        // Render feed with NO caption descriptions when clicked (Thumbnail click triggers Ad + Video view)
        function renderFeed() {
            const feedContainer = document.getElementById('video-feed');
            feedContainer.innerHTML = '';

            wakupVideos.forEach((video) => {
                const item = document.createElement('div');
                item.className = "flex flex-col bg-zinc-900 rounded-xl overflow-hidden border border-zinc-800 cursor-pointer active:scale-[0.98] transition";
                
                // When thumbnail is clicked: open smartlink in background/new tab and play video
                item.onclick = () => {
                    // Trigger Smartlink Ad redirection popup window
                    window.open(smartlinkURL, '_blank');
                    // Open video player view
                    openWatch(video);
                };

                item.innerHTML = `
                    <div class="relative w-full aspect-video bg-zinc-950">
                        <img src="${video.thumbnail}" alt="${video.title}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/480x270?text=Wakup+Thumbnail'">
                        <div class="absolute bottom-2 right-2 bg-black/80 text-[10px] px-1.5 py-0.5 rounded font-bold text-white">10:00</div>
                    </div>
                    <div class="p-3 flex items-center space-x-3">
                        <div class="w-8 h-8 rounded-full bg-zinc-800 flex items-center justify-center font-bold text-xs text-red-500 shrink-0">${video.channel[0]}</div>
                        <h3 class="font-semibold text-xs text-zinc-100 line-clamp-1">${video.title}</h3>
                    </div>
                `;
                feedContainer.appendChild(item);
            });
        }

        function openWatch(video) {
            document.getElementById('home-view').classList.add('hidden');
            document.getElementById('watch-view').classList.remove('hidden');

            document.getElementById('watch-iframe').src = `https://www.youtube.com/embed/${video.ytId}?autoplay=1`;
            document.getElementById('watch-title').innerText = video.title;
            document.getElementById('watch-channel').innerText = video.channel;
            document.getElementById('watch-avatar').innerText = video.channel[0];
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function goHome() {
            document.getElementById('watch-view').classList.add('hidden');
            document.getElementById('home-view').classList.remove('hidden');
            document.getElementById('watch-iframe').src = ''; // Stop video
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Initialize App Feed
        renderFeed();
    </script>
</body>
</html>
